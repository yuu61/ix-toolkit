[project]
name = "ix-toolkit"
version = "0.1.0"
description = "NEC IX SSH client used by the ix-* Claude Code skills"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "yuu61" }]
dependencies = ["netmiko>=4.7", "paramiko>=3.0"]

[project.urls]
Homepage = "https://github.com/yuu61/ix-toolkit"

# The skills call this command by name. Keeping it out of the skill directories is
# deliberate: `gh skill install` copies one skill directory and nothing around it,
# so a shared script inside skills/ would have to be duplicated into every skill.
[project.scripts]
ix-ssh = "ix_ssh:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ix_ssh"]
