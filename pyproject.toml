[project]
name = "ix-toolkit"
version = "0.1.0"
description = "NEC IX SSH client used by the ix-* Claude Code skills"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "yuu61" }]
# paramiko 5 dropped the ssh-rsa (SHA-1) host key algorithm. IX2000/IX3000 host
# keys are RSA or DSA only (FD 10.11 "SSH を利用した遠隔設定"), and DSA already went
# in paramiko 4, so with paramiko 5 the key exchange with them fails outright.
dependencies = ["netmiko>=4.7", "paramiko>=3.0,<5"]

[project.optional-dependencies]
dev = ["ruff"]

[project.urls]
Homepage = "https://github.com/yuu61/ix-toolkit"

# The skills call this command from PATH; `uv tool install -e <clone>` puts it
# there (see README). The repository is always cloned whole, so the client can
# live in src/ as an ordinary package instead of being copied into every skill
# directory.
[project.scripts]
ix-ssh = "ix_ssh.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ix_ssh"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-select = ["PERF", "PLW2901", "PLW1514"]
# Enable only explicitly selected preview rules (PLW1514).
preview = true
explicit-preview-rules = true
